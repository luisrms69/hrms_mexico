# mkdocs.yml — HRMS México
# Basado en frappe-infrastructure/docs/templates/mkdocs-base.yml
#
# Comandos:
#   pip install mkdocs mkdocs-material
#   mkdocs serve          → http://localhost:8000
#   mkdocs build --strict → falla ante links rotos o archivos en nav inexistentes (requerido en CI)
#
# Regla: todo archivo nuevo en docs/ debe agregarse al nav: antes del commit. site/ va en .gitignore.

site_name: "HRMS México"
site_description: "Cumplimiento laboral mexicano para Frappe HRMS"
site_author: "Consultoria en Negocios y Aplicaciones"
docs_dir: docs

nav:
  - Inicio: index.md
  - Manual de usuario:
    - Índice: usuario/index.md
  - Documentación técnica:
    - Índice: tecnico/index.md
    - Arquitectura: tecnico/arquitectura.md
  - Releases:
    - Changelog: CHANGELOG.md
  - Decisiones (ADR):
    - Índice: adr/index.md
    - ADR-0000 Estado inicial: adr/0000-estado-inicial-app.md
    - ADR-0001 Reutilizar HRMS nativo: adr/0001-estrategia-reutilizar-hrms-nativo.md
    - ADR-0002 Inmutabilidad del marcaje: adr/0002-inmutabilidad-marcaje-original.md
    - ADR-0003 Trazabilidad y auditoría: adr/0003-trazabilidad-y-auditoria.md
    - ADR-0004 MX Attendance Summary: adr/0004-resumen-jornada-mx-attendance-summary.md
    - ADR-0005 Correcciones (Attendance Request): adr/0005-correcciones-via-attendance-request.md
    - ADR-0006 MX Attendance Acknowledgement: adr/0006-acuse-empleado-mx-attendance-acknowledgement.md
    - ADR-0007 Cumplimiento normativo MX: adr/0007-cumplimiento-normativo-mx.md
    - ADR-0008 Criptografía fuera de alcance: adr/0008-criptografia-fuera-de-alcance-inicial.md

theme:
  name: material
  language: es
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
